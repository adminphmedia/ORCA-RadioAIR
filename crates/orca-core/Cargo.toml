[package]
name = "orca-core"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
cpal = "0.15"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
ebur128 = "0.1.11"
hound = "3.5.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
ab_glyph = "0.2"
serialport = { version = "4", default-features = false }
midir = "0.10"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls", "ring"] }
thread-priority = "1"
sha2 = "0.10"
lofty = "0.21"
log = "0.4.35"
notify-debouncer-full = "0.3"
parking_lot = "0.13.0"
rand = "0.8"
rtrb = "0.3"
rubato = "0.15"
rusqlite = { version = "0.43.0", features = ["bundled", "chrono"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.5", features = ["mp3", "aac", "alac", "isomp4", "flac", "wav", "pcm", "vorbis", "ogg", "adpcm", "aiff"] }
toml = "1.2.2"
ureq = { version = "2", features = ["json"] }
urlencoding = "2.1.3"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
walkdir = "2.5.1"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_System_Threading", "Win32_Foundation"] }
