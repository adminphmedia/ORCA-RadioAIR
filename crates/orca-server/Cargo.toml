[package]
name = "orca-server"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive", "env"] }
env_logger = "0.11.12"
futures-util = "0.3.34"
log = "0.4.35"
orca-core = { version = "0.1.0", path = "../orca-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
