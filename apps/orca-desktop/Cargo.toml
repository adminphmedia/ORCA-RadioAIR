[package]
name = "orca-desktop"
version = "0.7.5"
edition = "2021"
description = "ORCA RadioAIR – odbavovací systém pro rádio"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde_json = "1"
orca-core = { path = "../../crates/orca-core" }
orca-server = { path = "../../crates/orca-server" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
