# Sestavení instalátorů ORCA RadioAIR pro macOS (Apple Silicon + Intel) a Windows.
# Spuštění: GitHub → Actions → "Build installers" → Run workflow (nebo push tagu v*).
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      # UI z Lovable: v repozitáři je přibalený poslední build (ui-dist/).
      # Pro automatické stažení aktuální verze z Lovable repozitáře nastav:
      #   Settings → Secrets and variables → Actions → Variables: LOVABLE_UI_REPO = adminphmedia/orca-radio-airwave
      #   Settings → Secrets and variables → Actions → Secrets:   UI_REPO_TOKEN = token s právem čtení (Contents: Read) k UI repozitáři
      - uses: oven-sh/setup-bun@v2
        if: ${{ vars.LOVABLE_UI_REPO != '' }}
      - name: Build UI (Lovable)
        if: ${{ vars.LOVABLE_UI_REPO != '' }}
        shell: bash
        env:
          UI_REPO_TOKEN: ${{ secrets.UI_REPO_TOKEN }}
        run: |
          if [ -n "$UI_REPO_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${UI_REPO_TOKEN}@github.com/${{ vars.LOVABLE_UI_REPO }}.git" ui-src
          else
            git clone --depth 1 "https://github.com/${{ vars.LOVABLE_UI_REPO }}.git" ui-src
          fi
          cd ui-src && bun install --frozen-lockfile && bun run build:orca
          find ../ui-dist -mindepth 1 ! -name README.md -delete
          cp -R dist/client/. ../ui-dist/

      # Windows: přibalit ffmpeg (LGPL build). macOS používá ffmpeg z Homebrew (brew install ffmpeg).
      - name: Bundle ffmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item (Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg-tmp | Select-Object -First 1).FullName apps/orca-desktop/resources/ffmpeg.exe

      # macOS: přibalit statický ffmpeg (univerzální binárka arm64 + x86_64, build ffmpeg.martin-riedl.de)
      - name: Bundle ffmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -e
          mkdir -p ff/arm ff/x64
          curl -fsSL -o ff/arm.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
          curl -fsSL -o ff/x64.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip
          unzip -q -o ff/arm.zip -d ff/arm && unzip -q -o ff/x64.zip -d ff/x64
          lipo -create "$(find ff/arm -name ffmpeg -type f | head -1)" "$(find ff/x64 -name ffmpeg -type f | head -1)" -output apps/orca-desktop/resources/ffmpeg
          chmod 755 apps/orca-desktop/resources/ffmpeg
          lipo -info apps/orca-desktop/resources/ffmpeg
          apps/orca-desktop/resources/ffmpeg -hide_banner -version | head -1

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        working-directory: apps/orca-desktop
        shell: bash
        run: |
          # Podepsání Apple certifikátem jen pokud jsou nastavené secrets, jinak ad-hoc podpis
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          cargo tauri build ${{ matrix.args }}
        env:
          # Volitelné podepsání a notarizace pro macOS (Apple Developer účet):
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: orca-radioair-${{ matrix.platform }}
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      # Při pushnutí tagu v* se instalátory připojí ke GitHub Release (ke stažení a testu)
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ORCA RadioAIR ${{ github.ref_name }}
          prerelease: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
