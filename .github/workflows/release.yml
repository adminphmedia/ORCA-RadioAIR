# Sestavení instalátorů ORCA RadioAIR pro macOS (Apple Silicon + Intel) a Windows.
# Spuštění: GitHub → Actions → "Build installers" → Run workflow (nebo push tagu v*).
name: Build installers

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Vydat verzi (GitHub Release + automatická aktualizace v aplikaci)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2

      # UI z Lovable: v repozitáři je přibalený poslední build (ui-dist/).
      # Pro automatické stažení aktuální verze z Lovable repozitáře nastav:
      #   Settings → Secrets and variables → Actions → Variables: LOVABLE_UI_REPO = adminphmedia/orca-radio-airwave
      #   Settings → Secrets and variables → Actions → Secrets:   UI_REPO_TOKEN = token s právem čtení (Contents: Read) k UI repozitáři
      - uses: oven-sh/setup-bun@v2
        if: ${{ vars.LOVABLE_UI_REPO != '' }}
      - name: Build UI (Lovable)
        if: ${{ vars.LOVABLE_UI_REPO != '' }}
        shell: bash
        env:
          UI_REPO_TOKEN: ${{ secrets.UI_REPO_TOKEN }}
        run: |
          if [ -n "$UI_REPO_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${UI_REPO_TOKEN}@github.com/${{ vars.LOVABLE_UI_REPO }}.git" ui-src
          else
            git clone --depth 1 "https://github.com/${{ vars.LOVABLE_UI_REPO }}.git" ui-src
          fi
          cd ui-src && bun install --frozen-lockfile && bun run build:orca
          find ../ui-dist -mindepth 1 ! -name README.md -delete
          cp -R dist/client/. ../ui-dist/

      # Windows: přibalit ffmpeg (LGPL build). macOS používá ffmpeg z Homebrew (brew install ffmpeg).
      - name: Bundle ffmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Copy-Item (Get-ChildItem -Recurse -Filter ffmpeg.exe ffmpeg-tmp | Select-Object -First 1).FullName apps/orca-desktop/resources/ffmpeg.exe

      # macOS: přibalit statický ffmpeg (univerzální binárka arm64 + x86_64, build ffmpeg.martin-riedl.de)
      - name: Bundle ffmpeg (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -e
          mkdir -p ff/arm ff/x64
          curl -fsSL -o ff/arm.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip
          curl -fsSL -o ff/x64.zip https://ffmpeg.martin-riedl.de/redirect/latest/macos/amd64/release/ffmpeg.zip
          unzip -q -o ff/arm.zip -d ff/arm && unzip -q -o ff/x64.zip -d ff/x64
          lipo -create "$(find ff/arm -name ffmpeg -type f | head -1)" "$(find ff/x64 -name ffmpeg -type f | head -1)" -output apps/orca-desktop/resources/ffmpeg
          chmod 755 apps/orca-desktop/resources/ffmpeg
          lipo -info apps/orca-desktop/resources/ffmpeg
          apps/orca-desktop/resources/ffmpeg -hide_banner -version | head -1

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # macOS: podpis certifikátem „Developer ID Application“ a notarizace u Apple (návod: docs/macos-podpis.md).
      # Bez nastavených secrets vznikne jako dosud ad-hoc podepsaná verze (při prvním spuštění je nutné ji povolit).
      - name: Prepare macOS signing
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::macOS: certifikát Apple není nastaven – vznikne ad-hoc podepsaná verze (bez notarizace)."
            echo "ORCA_MAC_SIGNED=0" >> "$GITHUB_ENV"; exit 0
          fi
          KC="$RUNNER_TEMP/orca-signing.keychain-db"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          # secret může obsahovat zalomení řádků, mezery nebo uvozovky – vše kromě znaků base64 se zahodí
          P12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | tr -d '\r\n\t "'"'" | base64 --decode > "$P12" 2>/dev/null || true
          SZ=$(wc -c < "$P12" | tr -d ' ')
          echo "Certifikát: $SZ bajtů po dekódování"
          if [ "$SZ" -lt 500 ]; then echo "::error::APPLE_CERTIFICATE není platný base64 text souboru .p12 (po dekódování jen $SZ bajtů). Vložte výstup příkazu: base64 -i certifikat.p12 | pbcopy"; exit 1; fi
          if head -c 30 "$P12" | grep -q "BEGIN"; then echo "::error::APPLE_CERTIFICATE je text PEM, ne soubor .p12. Exportujte z Klíčenky (Moje certifikáty → Exportovat → formát .p12) a vložte base64 -i certifikat.p12 | pbcopy"; exit 1; fi
          if openssl x509 -inform DER -in "$P12" -noout 2>/dev/null; then echo "::error::APPLE_CERTIFICATE je samotný certifikát (.cer) bez soukromého klíče. V Klíčence → Moje certifikáty rozbalte „Developer ID Application“, ověřte že pod ním je klíč, a exportujte jako .p12."; exit 1; fi
          if ! security import "$P12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security; then
            # novější macOS exportuje .p12 šifrované AES-256; když ho security neumí, přebalí se přes OpenSSL
            echo "Přímý import selhal – zkouším přebalit .p12 přes OpenSSL"
            OSSL=$(brew --prefix openssl@3 2>/dev/null)/bin/openssl; [ -x "$OSSL" ] || OSSL=openssl
            if ! "$OSSL" pkcs12 -in "$P12" -passin env:APPLE_CERTIFICATE_PASSWORD -nodes -out "$RUNNER_TEMP/cert.pem" 2>"$RUNNER_TEMP/ossl.err"; then
              cat "$RUNNER_TEMP/ossl.err" | grep -v -i "pass" | head -5
              echo "::error::Soubor .p12 nejde otevřít – nejspíš nesouhlasí heslo APPLE_CERTIFICATE_PASSWORD (heslo zadané při exportu z Klíčenky), nebo APPLE_CERTIFICATE neobsahuje .p12."; exit 1
            fi
            "$OSSL" pkcs12 -export -legacy -in "$RUNNER_TEMP/cert.pem" -out "$RUNNER_TEMP/cert2.p12" -passout env:APPLE_CERTIFICATE_PASSWORD 2>/dev/null || "$OSSL" pkcs12 -export -in "$RUNNER_TEMP/cert.pem" -out "$RUNNER_TEMP/cert2.p12" -passout env:APPLE_CERTIFICATE_PASSWORD
            rm -f "$RUNNER_TEMP/cert.pem"
            security import "$RUNNER_TEMP/cert2.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP/cert2.p12"
          fi
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="${APPLE_SIGNING_IDENTITY:-}"
          if [ -z "$ID" ]; then ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"; fi
          if [ -z "$ID" ]; then echo "::error::V certifikátu chybí identita „Developer ID Application“ (pro distribuci mimo App Store je potřeba právě tento typ)."; exit 1; fi
          echo "Podpisová identita: $ID"
          # přibalený ffmpeg musí být podepsaný stejně jako aplikace (hardened runtime + časové razítko), jinak notarizace selže
          codesign --force --options runtime --timestamp --sign "$ID" apps/orca-desktop/resources/ffmpeg
          codesign --verify --strict --verbose=2 apps/orca-desktop/resources/ffmpeg
          {
            echo "ORCA_MAC_SIGNED=1"
            echo "APPLE_SIGNING_IDENTITY=$ID"
            echo "ORCA_TAURI_CONFIG={\"bundle\":{\"macOS\":{\"signingIdentity\":\"$ID\"}}}"
          } >> "$GITHUB_ENV"
          # notarizace: přednostně App Store Connect API klíč, jinak Apple ID + heslo pro aplikaci
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            { echo "APPLE_API_KEY=$APPLE_API_KEY"; echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"; echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"; echo "ORCA_NOTARIZE=api"; } >> "$GITHUB_ENV"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ORCA_NOTARIZE=appleid" >> "$GITHUB_ENV"
          else
            echo "::warning::Notarizace není nastavená (chybí API klíč nebo Apple ID) – aplikace bude podepsaná, ale macOS ji při prvním spuštění stejně ověří online a může varovat."
            echo "ORCA_NOTARIZE=none" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: apps/orca-desktop
        shell: bash
        run: |
          # certifikát je už v klíčence (krok výše) – Tauri ho nemá importovat znovu
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          if [ "${ORCA_NOTARIZE:-none}" != "appleid" ]; then unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          if [ "${ORCA_MAC_SIGNED:-0}" != "1" ]; then unset APPLE_SIGNING_IDENTITY; fi
          # balíčky pro aktualizaci v aplikaci (podepsané klíčem updateru) jen když je klíč nastavený
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then export UPD=1; else export UPD=0; unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; echo "::warning::Chybí secret TAURI_SIGNING_PRIVATE_KEY – instalátory vzniknou, ale bez balíčků pro aktualizaci v aplikaci."; fi
          PY="$(command -v python3 || command -v python)"
          CONF="$("$PY" -c "import json,os; c=json.loads(os.environ.get('ORCA_TAURI_CONFIG') or '{}') if os.environ.get('ORCA_MAC_SIGNED')=='1' else {}; c.setdefault('bundle',{})['createUpdaterArtifacts']=os.environ['UPD']=='1'; print(json.dumps(c))")"
          cargo tauri build ${{ matrix.args }} --config "$CONF"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # DMG se notarizuje a „sešije“ (staple) zvlášť, aby se otevřel bez varování i bez internetu
      - name: Notarize and verify DMG (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="$(ls -d target/universal-apple-darwin/release/bundle/macos/*.app | head -1)"
          DMG="$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          if [ "${ORCA_MAC_SIGNED:-0}" != "1" ]; then
            echo "### macOS: ad-hoc podpis (bez certifikátu Apple)" >> "$GITHUB_STEP_SUMMARY"
            echo "Při prvním spuštění: pravé tlačítko na aplikaci → Otevřít (nebo Nastavení systému → Soukromí a zabezpečení → Přesto otevřít)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG"
          case "${ORCA_NOTARIZE:-none}" in
            api) xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m ;;
            appleid) xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 30m ;;
          esac
          if [ "${ORCA_NOTARIZE:-none}" != "none" ]; then
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          fi
          spctl --assess --type execute --verbose=2 "$APP" || true
          {
            echo "### macOS: podepsáno ($APPLE_SIGNING_IDENTITY)"
            echo "Notarizace: ${ORCA_NOTARIZE:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: orca-radioair-${{ matrix.platform }}
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

      # balíčky pro aktualizaci v aplikaci: bez mezer v názvu (GitHub by je v release přejmenoval)
      - name: Collect updater bundles
        shell: bash
        run: |
          set -e
          mkdir -p upd
          PY="$(command -v python3 || command -v python)"
          V="$("$PY" -c "import json;print(json.load(open('apps/orca-desktop/tauri.conf.json'))['version'])")"
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            F="$(ls target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -1 || true)"
            if [ -n "$F" ]; then cp "$F" "upd/ORCA-RadioAIR_${V}_universal.app.tar.gz"; cp "$F.sig" "upd/ORCA-RadioAIR_${V}_universal.app.tar.gz.sig"; fi
          else
            F="$(ls target/release/bundle/nsis/*-setup.exe 2>/dev/null | head -1 || true)"
            if [ -n "$F" ] && [ -f "$F.sig" ]; then cp "$F" "upd/ORCA-RadioAIR_${V}_x64-setup.exe"; cp "$F.sig" "upd/ORCA-RadioAIR_${V}_x64-setup.exe.sig"; fi
          fi
          ls -la upd

      - uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.platform }}
          path: upd/
          if-no-files-found: ignore

  # Vydání: GitHub Release s instalátory + latest.json → aplikace nabídne „Aktualizovat“ (Obecné → Aktualizace)
  publish:
    needs: build
    if: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Prepare release files
        id: prep
        shell: bash
        run: |
          set -e
          V="$(python3 -c "import json;print(json.load(open('apps/orca-desktop/tauri.conf.json'))['version'])")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          mkdir -p rel
          find art -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.tar.gz' -o -name '*.sig' \) -exec cp {} rel/ \;
          python3 - "$V" <<'PY'
          import json, os, sys, datetime
          v = sys.argv[1]; base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{v}/"
          txt = open("docs/RELEASE_NOTES.md", encoding="utf-8").read()
          body = txt.split("\n# ORCA", 1)[0].split("\n", 1)[-1].strip()
          plat = {}
          mac = f"ORCA-RadioAIR_{v}_universal.app.tar.gz"; win = f"ORCA-RadioAIR_{v}_x64-setup.exe"
          if os.path.exists("rel/" + mac + ".sig"):
              e = {"signature": open("rel/" + mac + ".sig").read().strip(), "url": base + mac}
              plat["darwin-aarch64"] = e; plat["darwin-x86_64"] = e
          if os.path.exists("rel/" + win + ".sig"):
              plat["windows-x86_64"] = {"signature": open("rel/" + win + ".sig").read().strip(), "url": base + win}
          if plat:
              json.dump({"version": v, "notes": body[:4000], "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "platforms": plat}, open("rel/latest.json", "w"), ensure_ascii=False, indent=2)
              print("latest.json:", list(plat))
          else:
              print("::warning::Bez podepsaných balíčků – release bude jen s instalátory (aktualizace v aplikaci ho nenabídne).")
          PY
          ls -la rel
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.prep.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ORCA RadioAIR ${{ steps.prep.outputs.version }}
          prerelease: false
          make_latest: true
          body_path: docs/RELEASE_NOTES.md
          files: rel/*
